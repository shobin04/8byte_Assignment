name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.tf'
      - '**.tfvars'
      - 'terraform_aws/**'
      - '8bytemonitor/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.tf'
      - '**.tfvars'
      - 'terraform_aws/**'
      - '8bytemonitor/**'

jobs:
  # 1. RUN TESTS & DEPENDENCY AUDIT
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f sample_app/package.json ]; then
            cd sample_app && npm install
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json detected, skipping npm install."
          fi

      - name: Run Unit Tests
        run: |
          if [ -f sample_app/package.json ]; then
            cd sample_app && npm test --if-present
          elif [ -f package.json ]; then
            npm test --if-present
          else
            echo "Skipping test execution."
          fi

      - name: Scan Dependencies (npm audit)
        run: |
          if [ -f sample_app/package.json ]; then
            cd sample_app && npm audit --audit-level=high || true
          elif [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "Skipping dependency scan."
          fi

  # 2. BUILD, CONTAINER SCAN & PUSH TO DOCKER HUB
  build-scan-push:
    needs: test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -f sample_app/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest sample_app

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

  # 3. STAGING DEPLOYMENT (PORT 3001)
  deploy-staging:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Container to Staging
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.BASTION_HOST }}" \
              -i ~/.ssh/id_rsa \
              ubuntu@${{ secrets.PRIVATE_HOST }} << 'EOF'
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

            docker stop devops-app-staging || true
            docker rm devops-app-staging || true
            
            docker run -d \
              --name devops-app-staging \
              --restart always \
              -p 3001:3000 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          EOF

  # 4. MANUAL APPROVAL GATE & PRODUCTION DEPLOYMENT (PORT 3000)
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Container to Production
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.BASTION_HOST }}" \
              -i ~/.ssh/id_rsa \
              ubuntu@${{ secrets.PRIVATE_HOST }} << 'EOF'
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

            docker stop devops-app-prod || true
            docker rm devops-app-prod || true
            
            docker run -d \
              --name devops-app-prod \
              --restart always \
              -p 3000:3000 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          EOF

  # 5. FAILURE NOTIFICATION (EMAIL ALERT)
  notify-failure:
    needs: [test-and-scan, build-scan-push, deploy-staging, deploy-production]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Alert on Pipeline Failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FAILED: CI/CD Pipeline - ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions CI/CD <noreply@github.com>
          body: |
            The CI/CD pipeline failed during execution.

            Repository: ${{ github.repository }}
            Branch/Ref: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Commit SHA: ${{ github.sha }}

            View workflow logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}