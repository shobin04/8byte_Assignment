global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "devops_app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["172.17.0.1:3000", "172.17.0.1:3001"]
